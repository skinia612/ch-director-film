interface:
  display_name: "CHDirectorFilm"
  short_description: "生成电影预告片、MTV与高端文旅导演型提示词"
  default_prompt: "使用 $ch-director-film：按导演编号—视频类型—生成模式三层选择；已明示的层级直接继承，缺失层一次询问。视频类型包括1电影预告片、2 MTV/音乐影像、3高端文旅宣传片；生成模式包括A自由组合（随机）和B精确导演分镜。按所选类型加载独立的镜头选择、节奏、声音与误判审稿规则，并按所选导演设计构图、运镜、光影、表演、配角面孔服饰与环境生活。完成草稿后反推预期观感，独立审稿、修正并输出一份完整提示词。"
