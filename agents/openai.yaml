interface:
  display_name: "CHDirectorFilm"
  short_description: "生成并审查导演型电影片花与预告片快剪提示词"
  default_prompt: "使用 $ch-director-film：未指定导演时先让我选择，仅在用户未明确A/B时询问自由组合片花版或精确导演分镜版。电影预告片先锁定题材气质、导演可见机制、人物银幕气质、能量曲线和余韵，不强制编写卖点命题、中心悬念或跨镜因果；各组通常是独立事件，最多一组两个镜头有关联。画面出现配角、群演或社会空间时，按所选导演分别设计年龄体态、面孔发式、服装谱系、职业动作和群众密度，禁止同脸同装与通用灰青路人模板。再加载非连续剪辑、弹性镜长、配乐卡点和声音桥；B模式闪切仍须明确空间范围、机位角度、元素分层和运镜终点。完成草稿后审稿修正并输出完整提示词。"
